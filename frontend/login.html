<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — Darul-Kariim School Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        body { background-color: #f4f6f9; height: 100vh; display: flex; align-items: center; justify-content: center; }
        .login-card { max-width: 420px; width: 100%; border: none; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); background: #ffffff; }
    </style>
</head>
<body>
    <div class="card login-card p-4">
        <div class="text-center mb-4">
            <i class="fa-solid fa-graduation-cap fa-3x text-success mb-2"></i>
            <h3 class="fw-bold text-dark">DARUL-KARIIM</h3>
            <p class="text-muted small">School Management System</p>
        </div>
        <form id="loginForm" autocomplete="off">
            <div class="mb-3">
                <label class="form-label small fw-semibold">Email ama Username</label>
                <input type="text" id="email" class="form-control" autocomplete="username" required value="admin@darulkarim.edu">
            </div>
            <div class="mb-3">
                <label class="form-label small fw-semibold">Password</label>
                <input type="password" id="password" class="form-control" autocomplete="current-password" required value="Admin@123">
            </div>
            <button type="submit" class="btn btn-success w-100 py-2 fw-semibold">Sign In</button>
        </form>
        <div id="alertBox" class="mt-3"></div>
    </div>
    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const alertBox = document.getElementById('alertBox');

            try {
                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await res.json();
                if (data.success) {
                    localStorage.setItem('token', data.token);
                    localStorage.setItem('user', JSON.stringify(data.data));
                    window.location.href = '/index.html';
                } else {
                    alertBox.innerHTML = `<div class="alert alert-danger py-2 small">${data.message}</div>`;
                }
            } catch (err) {
                alertBox.innerHTML = `<div class="alert alert-danger py-2 small">Cillad xagga shabakadda ah. Fadlan dib u tijaabi.</div>`;
            }
        });
    </script>
</body>
</html>
