<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — Darul-Kariim School Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <style>
        body { 
            background-color: #f4f6f9; 
            height: 100vh; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            font-family: system-ui, -apple-system, sans-serif;
            margin: 0;
        }
        .login-card { 
            max-width: 420px; 
            width: 100%; 
            border: none; 
            border-radius: 12px; 
            box-shadow: 0 4px 20px rgba(0,0,0,0.08); 
            background: #ffffff; 
            padding: 30px;
        }
    </style>
</head>
<body>
    <div class="card login-card">
        <div class="text-center mb-4">
            <i class="fa-solid fa-graduation-cap fa-3x text-success mb-2"></i>
            <h3 class="fw-bold text-dark mb-1">DARUL-KARIIM</h3>
            <p class="text-muted small">School Management System</p>
        </div>
        <form id="loginForm" autocomplete="off">
            <div class="mb-3">
                <label class="form-label small fw-semibold">Email ama Username</label>
                <input type="text" id="email" class="form-control" autocomplete="username" required value="admin@darulkarim.edu">
            </div>
            <div class="mb-3">
                <label class="form-label small fw-semibold">Password</label>
                <input type="password" id="password" class="form-control" autocomplete="current-password" required value="Admin@123">
            </div>
            <button type="submit" class="btn btn-success w-100 py-2 fw-semibold">Sign In</button>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.getElementById('loginForm').addEventListener('submit', (e) => {
            e.preventDefault();
            // Keydinta token-ka si uu ula jaanqaado bogagga kale ee nidaamka
            localStorage.setItem('token', 'fake-token-2026');
            localStorage.setItem('user', JSON.stringify({ username: 'Administrator', role: 'Super Admin' }));
            window.location.href = 'index.html';
        });
    </script>
</body>
</html>
